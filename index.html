<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MATABASE // GLOBAL_TRACKER</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #050505;
            --purple: #6a0dad;
            --font: 'Courier New', monospace;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: var(--font);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            background-image: radial-gradient(circle, #1a1a2e 0%, #050505 100%);
        }

        .terminal-container {
            width: 100%; max-width: 800px;
            border: 1px solid var(--neon-green);
            background: rgba(0, 0, 0, 0.9);
            padding: 20px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        .header { text-align: center; border-bottom: 2px solid var(--neon-green); margin-bottom: 20px; padding-bottom: 10px; }
        
        .live-feed {
            background: rgba(106, 13, 173, 0.1);
            border: 1px solid var(--purple);
            padding: 10px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }

        .scan-card {
            border: 1px dashed var(--neon-green);
            padding: 15px; margin-bottom: 10px;
            cursor: pointer; transition: 0.3s;
            display: flex; justify-content: space-between; align-items: center;
        }

        .scan-card:hover { background: rgba(0, 255, 65, 0.1); border-style: solid; }

        .btn { background: var(--neon-green); color: black; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; }

        #display { border-top: 1px solid var(--purple); margin-top: 20px; padding-top: 15px; min-height: 200px; }
        .data-row { display: flex; border-bottom: 1px solid #111; padding: 5px 0; font-size: 0.9rem; }
        .key { color: #888; width: 150px; text-transform: uppercase; }
        .val { color: var(--neon-green); flex: 1; word-break: break-all; }

        .pulse { animation: blink 1s infinite; color: var(--purple); font-weight: bold; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="terminal-container">
        <div class="header">
            <h1>> MATABASE_GLOBAL_v3</h1>
        </div>

        <div class="live-feed">
            <div><span class="pulse">●</span> LIVE_ACTIVITY: <span id="latest-name">SEARCHING...</span></div>
            <button class="btn" onclick="fetchData('LATEST')">VIEW_LATEST</button>
        </div>

        <div class="scan-card" onclick="fetchData('ICYTHECOOLEST')">
            <div>TARGET: <span style="font-size: 1.2rem;">ICYTHECOOLEST</span></div>
            <button class="btn">SCAN_ID</button>
        </div>

        <div id="display">
            <div style="color: #444; text-align: center;">[ SELECT_UPLINK_TO_EXTRACT_DATA ]</div>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://matabase.noahshoe08.workers.dev";

        // Auto-fetch latest name on load
        async function getLatestName() {
            try {
                const res = await fetch(`${WORKER_URL}/LATEST`);
                const json = await res.json();
                document.getElementById('latest-name').innerText = json.user_data.username || "UNKNOWN";
            } catch (e) { document.getElementById('latest-name').innerText = "OFFLINE"; }
        }

        async function fetchData(endpoint) {
            const display = document.getElementById('display');
            display.innerHTML = '<div class="pulse" style="text-align:center;">SYNCING_DATABASE...</div>';

            try {
                const res = await fetch(`${WORKER_URL}/${endpoint}`);
                const wrapper = await res.json();
                const data = wrapper.user_data;

                display.innerHTML = `<div style="color:var(--purple); margin-bottom:10px;">[ DATA_DUMP: ${endpoint} ]</div>`;

                Object.entries(data).forEach(([key, value]) => {
                    const row = document.createElement('div');
                    row.className = 'data-row';
                    let val = Array.isArray(value) ? value.join(' | ') : value;
                    row.innerHTML = `<span class="key">${key}:</span><span class="val">${val}</span>`;
                    display.appendChild(row);
                });
            } catch (e) {
                display.innerHTML = '<div style="color:red; text-align:center;">CRITICAL_ERROR: UPLINK_LOST</div>';
            }
        }

        getLatestName();
        // Refresh latest name every 30 seconds
        setInterval(getLatestName, 30000);
    </script>
</body>
</html>
